[package]
name = "rosetta-desktop"
version = "0.1.1"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
dirs = "7.0"
ndarray = "0.16"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
libloading = "0.9"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
windows-numerics = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-rustls", "directml"] }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[features]
cuda = ["ort/cuda"]
